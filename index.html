<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>8th Wall SLAM - World Effects</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- 1. A-Frame ANTES del engine -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- 2. 8th Wall Engine (standalone binary) - async + preload slam -->
    <script async src="./xr-standalone/xr.js" data-preload-chunks="slam"></script>

    <!-- 3. Three.js loaders + VRM (use A-Frame's THREE) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@1.0.9/lib/three-vrm.js"></script>

    <script>
      window.addEventListener('xrloaded', () => {
        console.log('✅ XR8 v' + XR8.version() + ' cargado');
        console.log('✅ XrController:', !!XR8.XrController);
      });
    </script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* Ocultar botón VR de A-Frame y del Immersive Web Emulator */
      .a-enter-vr, .a-enter-ar,
      .a-enter-vr-button, .a-enter-ar-button,
      [class*="immersive-web"], [class*="webxr"] {
        display: none !important;
      }
      #info-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(0,0,0,0.85);
        color: #0f0;
        font-family: monospace;
        font-size: 13px;
        padding: 10px 15px;
        z-index: 999999;
        line-height: 1.6;
      }
      #info-banner .warning { color: #ff0; }
      #info-banner .ok { color: #0f0; }
      #info-banner .tip { color: #0af; }
    </style>
  </head>

  <body>
    <div id="info-banner">
      <span class="ok">Cargando...</span>
    </div>

    <script>
      const banner = document.getElementById('info-banner');
      
      window.addEventListener('xrloaded', () => {
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        
        if (isMobile) {
          banner.innerHTML = '<span class="ok">✅ MÓVIL DETECTADO — Webcam + SLAM activo!</span>';
          setTimeout(() => banner.style.display = 'none', 3000);
        } else {
          banner.innerHTML = 
            '<span class="ok">✅ Engine XR8 cargado</span><br>' +
            '<span class="warning">⚠️ DESKTOP: Estás viendo el entorno 3D simulado (preview)</span><br>' +
            '<span class="tip">📱 Para webcam + SLAM real: abrí esta URL en tu celular via HTTPS (ngrok)</span><br>' +
            '<span class="tip">🖱️ Usá el mouse para moverte: click+arrastrá para rotar, scroll para zoom</span>';
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        const scene = document.querySelector('a-scene');
        if (!scene) return;
        scene.addEventListener('camerastatuschange', (e) => {
          console.log('📷 Camera status:', e.detail.status);
          if (e.detail.status === 'hasVideo') {
            banner.innerHTML = '<span class="ok">✅ WEBCAM ACTIVA + SLAM TRACKING</span>';
            setTimeout(() => banner.style.display = 'none', 3000);
          }
        });
        scene.addEventListener('realityready', () => console.log('✅ Reality ready'));
        scene.addEventListener('realityerror', (e) => {
          console.error('❌ Error:', e.detail);
          banner.innerHTML = '<span style="color:red">❌ Error: ' + JSON.stringify(e.detail) + '</span>';
        });
      });
    </script>

    <script>
      const MIXAMO_RIG_MAP = {
        mixamorigHips: 'hips',
        mixamorigSpine: 'spine',
        mixamorigSpine1: 'chest',
        mixamorigSpine2: 'upperChest',
        mixamorigNeck: 'neck',
        mixamorigHead: 'head',
        mixamorigLeftShoulder: 'leftShoulder',
        mixamorigLeftArm: 'leftUpperArm',
        mixamorigLeftForeArm: 'leftLowerArm',
        mixamorigLeftHand: 'leftHand',
        mixamorigLeftHandThumb1: 'leftThumbMetacarpal',
        mixamorigLeftHandThumb2: 'leftThumbProximal',
        mixamorigLeftHandThumb3: 'leftThumbDistal',
        mixamorigLeftHandIndex1: 'leftIndexProximal',
        mixamorigLeftHandIndex2: 'leftIndexIntermediate',
        mixamorigLeftHandIndex3: 'leftIndexDistal',
        mixamorigLeftHandMiddle1: 'leftMiddleProximal',
        mixamorigLeftHandMiddle2: 'leftMiddleIntermediate',
        mixamorigLeftHandMiddle3: 'leftMiddleDistal',
        mixamorigLeftHandRing1: 'leftRingProximal',
        mixamorigLeftHandRing2: 'leftRingIntermediate',
        mixamorigLeftHandRing3: 'leftRingDistal',
        mixamorigLeftHandPinky1: 'leftLittleProximal',
        mixamorigLeftHandPinky2: 'leftLittleIntermediate',
        mixamorigLeftHandPinky3: 'leftLittleDistal',
        mixamorigRightShoulder: 'rightShoulder',
        mixamorigRightArm: 'rightUpperArm',
        mixamorigRightForeArm: 'rightLowerArm',
        mixamorigRightHand: 'rightHand',
        mixamorigRightHandThumb1: 'rightThumbMetacarpal',
        mixamorigRightHandThumb2: 'rightThumbProximal',
        mixamorigRightHandThumb3: 'rightThumbDistal',
        mixamorigRightHandIndex1: 'rightIndexProximal',
        mixamorigRightHandIndex2: 'rightIndexIntermediate',
        mixamorigRightHandIndex3: 'rightIndexDistal',
        mixamorigRightHandMiddle1: 'rightMiddleProximal',
        mixamorigRightHandMiddle2: 'rightMiddleIntermediate',
        mixamorigRightHandMiddle3: 'rightMiddleDistal',
        mixamorigRightHandRing1: 'rightRingProximal',
        mixamorigRightHandRing2: 'rightRingIntermediate',
        mixamorigRightHandRing3: 'rightRingDistal',
        mixamorigRightHandPinky1: 'rightLittleProximal',
        mixamorigRightHandPinky2: 'rightLittleIntermediate',
        mixamorigRightHandPinky3: 'rightLittleDistal',
        mixamorigLeftUpLeg: 'leftUpperLeg',
        mixamorigLeftLeg: 'leftLowerLeg',
        mixamorigLeftFoot: 'leftFoot',
        mixamorigLeftToeBase: 'leftToes',
        mixamorigRightUpLeg: 'rightUpperLeg',
        mixamorigRightLeg: 'rightLowerLeg',
        mixamorigRightFoot: 'rightFoot',
        mixamorigRightToeBase: 'rightToes'
      };

      AFRAME.registerComponent('vrm-character', {
        schema: {
          model: { type: 'string' },
          animation: { type: 'string' },
          speed: { type: 'number', default: 0.8 }
        },
        init() {
          this.vrm = null;
          this.mixer = null;
          this._loadVRM();
        },
        tick(time, delta) {
          const deltaSeconds = delta / 1000;
          if (this.mixer) {
            this.mixer.update(deltaSeconds);
          }
          if (this.vrm) {
            this.vrm.update(deltaSeconds);
          }
        },
        _loadVRM() {
          if (!this.data.model) {
            return;
          }

          const loader = new THREE.GLTFLoader();
          loader.register((parser) => new THREE.VRMLoaderPlugin(parser));

          loader.load(
            this.data.model,
            (gltf) => {
              const vrm = gltf.userData.vrm;
              if (!vrm) {
                console.error('VRM no encontrado en el GLTF');
                return;
              }

              if (THREE.VRMUtils?.removeUnnecessaryJoints) {
                THREE.VRMUtils.removeUnnecessaryJoints(vrm.scene);
              }
              if (THREE.VRMUtils?.rotateVRM0) {
                THREE.VRMUtils.rotateVRM0(vrm);
              }

              this.vrm = vrm;
              this._prepareMaterials(vrm);
              this.el.object3D.add(vrm.scene);
              this._loadAnimation();
            },
            undefined,
            (error) => {
              console.error('Error cargando VRM:', error);
            }
          );
        },
        _prepareMaterials(vrm) {
          vrm.scene.traverse((object) => {
            object.frustumCulled = false;
            if (!object.isMesh) {
              return;
            }

            object.castShadow = true;
            object.receiveShadow = true;

            const material = object.material;
            if (!material) {
              return;
            }

            const name = (material.name || '').toLowerCase();
            const isHoodie =
              name === 'test' ||
              name.includes('golden yellow') ||
              name.includes('hoodie') ||
              name.includes('hood') ||
              name.includes('sweater') ||
              name.includes('shirt') ||
              name.includes('outfit') ||
              name.includes('clothes') ||
              material.name === '09-Golden Yellow #FFBF0B GFAR.001' ||
              material.name === 'Test';

            if (isHoodie) {
              material.map = null;
              material.color.setHex(0xffffff);
              material.roughness = 0.8;
              material.metalness = 0.0;
              material.emissive = new THREE.Color(0x000000);
              material.needsUpdate = true;
            }
          });

          vrm.scene.rotation.y = Math.PI;
          if (vrm.expressionManager) {
            try {
              vrm.expressionManager.setValue('joy', 1.0);
            } catch (e) {
              // Ignore missing expression
            }
          }
        },
        _loadAnimation() {
          if (!this.data.animation || !this.vrm) {
            return;
          }

          this.vrm.humanoid?.resetNormalizedPose();
          const fbxLoader = new THREE.FBXLoader();

          fbxLoader.load(
            this.data.animation,
            (fbx) => {
              const clip = this._convertMixamoAnimation(fbx);
              if (!clip) {
                console.error('No se pudo convertir la animacion');
                return;
              }

              if (this.mixer) {
                this.mixer.stopAllAction();
              }
              this.mixer = new THREE.AnimationMixer(this.vrm.scene);
              const action = this.mixer.clipAction(clip);
              action.setLoop(THREE.LoopRepeat, Infinity);
              action.clampWhenFinished = false;
              action.timeScale = this.data.speed;
              action.play();
            },
            undefined,
            (error) => {
              console.error('Error cargando animacion:', error);
            }
          );
        },
        _convertMixamoAnimation(fbx) {
          const clip = THREE.AnimationClip.findByName(fbx.animations, 'mixamo.com') || fbx.animations[0];
          if (!clip) {
            return null;
          }

          const tracks = [];
          const restRotationInverse = new THREE.Quaternion();
          const parentRestWorldRotation = new THREE.Quaternion();
          const quatTemp = new THREE.Quaternion();
          const vec3Temp = new THREE.Vector3();

          const motionHipsHeight = fbx.getObjectByName('mixamorigHips')?.position.y;
          const vrmHipsY = this.vrm.humanoid?.getNormalizedBoneNode('hips')?.getWorldPosition(vec3Temp).y;
          const vrmRootY = this.vrm.scene.getWorldPosition(vec3Temp).y;
          const vrmHipsHeight = Math.abs(vrmHipsY - vrmRootY);
          const hipsPositionScale = motionHipsHeight ? (vrmHipsHeight / motionHipsHeight) : 1;

          clip.tracks.forEach((track) => {
            const trackSplitted = track.name.split('.');
            const mixamoRigName = trackSplitted[0];
            const vrmBoneName = MIXAMO_RIG_MAP[mixamoRigName];
            const vrmNodeName = this.vrm.humanoid?.getNormalizedBoneNode(vrmBoneName)?.name;
            const mixamoRigNode = fbx.getObjectByName(mixamoRigName);

            if (!vrmNodeName || !mixamoRigNode) {
              return;
            }

            const propertyName = trackSplitted[1];
            mixamoRigNode.getWorldQuaternion(restRotationInverse).invert();
            if (mixamoRigNode.parent) {
              mixamoRigNode.parent.getWorldQuaternion(parentRestWorldRotation);
            } else {
              parentRestWorldRotation.identity();
            }

            if (track instanceof THREE.QuaternionKeyframeTrack) {
              for (let i = 0; i < track.values.length; i += 4) {
                const flatQuaternion = track.values.slice(i, i + 4);
                quatTemp.fromArray(flatQuaternion);
                quatTemp.premultiply(parentRestWorldRotation).multiply(restRotationInverse);
                quatTemp.toArray(flatQuaternion);
                flatQuaternion.forEach((value, index) => {
                  track.values[index + i] = value;
                });
              }

              tracks.push(
                new THREE.QuaternionKeyframeTrack(
                  `${vrmNodeName}.${propertyName}`,
                  track.times,
                  track.values.map((value, index) =>
                    this.vrm.meta?.metaVersion === '0' && index % 2 === 0 ? -value : value
                  )
                )
              );
            } else if (track instanceof THREE.VectorKeyframeTrack) {
              const values = track.values.map((value, index) =>
                (this.vrm.meta?.metaVersion === '0' && index % 3 !== 1 ? -value : value) * hipsPositionScale
              );
              tracks.push(
                new THREE.VectorKeyframeTrack(
                  `${vrmNodeName}.${propertyName}`,
                  track.times,
                  values
                )
              );
            }
          });

          return new THREE.AnimationClip('vrmAnimation', clip.duration, tracks);
        }
      });
    </script>

    <a-scene
      xrweb="disableWorldTracking: false; allowedDevices: any"
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true"
      loading-screen="enabled: false">

      <!-- Luces -->
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="-1 2 1"></a-entity>

      <!-- Snoo VRM animado -->
      <a-entity
        id="snoo-vrm"
        position="1 0 -2"
        scale="0.9 0.9 0.9"
        vrm-character="model: ./redditslides/public/reddit-animation/models/finalsnoo.vrm; animation: ./redditslides/public/reddit-animation/animations/Step Hip Hop Dance.fbx; speed: 0.8">
      </a-entity>

      <!-- Cilindro verde flotante -->
      <a-cylinder
        position="-1 0.4 -2"
        radius="0.05" height="0.16"
        color="#7BC8A4"
        animation="property: position; to: -1 0.8 -2; dir: alternate; loop: true; dur: 2000; easing: easeInOutQuad">
      </a-cylinder>

      <a-camera position="0 1.2 0"></a-camera>
    </a-scene>

    <div style="position:fixed;bottom:10px;right:10px;font-size:10px;color:rgba(255,255,255,0.5);z-index:9999;pointer-events:none;">
      8th Wall XR Engine © Niantic Spatial
    </div>
  </body>
</html>
