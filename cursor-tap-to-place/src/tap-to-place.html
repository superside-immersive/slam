<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VRM Tap-to-Place (A-Frame + SLAM)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- 1. A-Frame BEFORE engine — brings its own THREE.js (r152) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- 2. 8th Wall standalone (NOT the ECS runtime) -->
    <script async src="./xr-standalone/xr.js" data-preload-chunks="slam"></script>

    <!-- 3. Bridge AFRAME.THREE → window.THREE so ALL loaders use ONE engine -->
    <script>
      if (window.AFRAME && window.AFRAME.THREE) {
        window.THREE = window.AFRAME.THREE;
        console.log('THREE bridged from AFRAME.THREE');
      }
    </script>

    <!-- 4. UMD loaders that attach to window.THREE -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@1.0.9/lib/three-vrm.js"></script>
    <script>
      let fbxResolve, fbxReject;
      window.fbxLoaderReady = new Promise((resolve, reject) => {
        fbxResolve = resolve; fbxReject = reject;
      });
      window._fbxLoaderResolve = fbxResolve;
      window._fbxLoaderReject = fbxReject;
    </script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
      }
    }
    </script>
    <script type="module">
      (async () => {
        try {
          const { FBXLoader } = await import('three/addons/loaders/FBXLoader.js');
          window.FBXLoader = FBXLoader;
          if (window._fbxLoaderResolve) window._fbxLoaderResolve(FBXLoader);
          console.log('FBXLoader attached via module import');
        } catch (error) {
          if (window._fbxLoaderReject) window._fbxLoaderReject(error);
          console.error('FBXLoader attach failed:', error);
        }
      })();
    </script>
    <script>
      console.log('GLTFLoader attached:', !!THREE.GLTFLoader);
      if (window.fbxLoaderReady && typeof window.fbxLoaderReady.then === 'function') {
        window.fbxLoaderReady
          .then(() => console.log('FBXLoader attached:', !!window.FBXLoader))
          .catch((error) => console.error('FBXLoader attach failed:', error));
      }
    </script>
    <script>
      window.addEventListener('xrloaded', () => {
        console.log('XR8 v' + XR8.version() + ' cargado');
      });
    </script>

    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
      .a-enter-vr, .a-enter-ar, .a-enter-vr-button, .a-enter-ar-button,
      [class*="immersive-web"], [class*="webxr"] { display:none !important; }

      /* ── Reddit-themed overrides for 8th Wall permission / loading dialogs ── */
      .immersive-background-8w {
        background: linear-gradient(135deg, #1a1a2e 0%, #0d0d0d 100%) !important;
      }
      .prompt-box-8w {
        background-color: #1a1a1b !important;
        color: #d7dadc !important;
        border: 1px solid #343536 !important;
        border-radius: 16px !important;
        filter: drop-shadow(0 4px 24px rgba(0,0,0,0.6)) !important;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      }
      .prompt-box-8w p {
        color: #d7dadc !important;
        font-size: 14px !important;
        line-height: 1.5 !important;
      }
      .prompt-button-8w {
        border-radius: 20px !important;
        font-weight: 600 !important;
        font-size: 14px !important;
        padding: 8px 16px !important;
        transition: opacity 0.15s !important;
        background-color: #343536 !important;
        color: #d7dadc !important;
      }
      .button-primary-8w {
        background-color: #FF4500 !important;
        color: #fff !important;
      }
      .poweredby-img-8w {
        opacity: 0.3 !important;
        filter: grayscale(1) brightness(2) !important;
      }
      .immersive-enter-button-8w {
        background-color: #FF4500 !important;
        border-radius: 24px !important;
        font-weight: 600 !important;
      }
      /* ── End 8th Wall overrides ── */
      #info-banner {
        position:fixed; top:0; left:0; right:0;
        background:rgba(0,0,0,0.88); color:#FF4500;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size:13px; font-weight:500;
        padding:10px 15px; z-index:999999; line-height:1.6;
        border-bottom: 2px solid #FF4500;
      }
      #info-banner .warning { color:#FFD700; }
      #info-banner .ok { color:#FF4500; }
      #info-banner .tip { color:#FF6B35; }
      #gh-qr {
        position:fixed; bottom:12px; left:12px; z-index:999999;
        background:rgba(255,255,255,0.08); border-radius:10px; padding:4px;
        box-shadow:0 1px 8px rgba(0,0,0,0.2); pointer-events:auto;
        border: 1px solid rgba(255,255,255,0.22);
        opacity: 0.42;
        transition: opacity 0.2s;
      }
      #gh-qr:hover { opacity: 0.65; }
      #gh-qr img { display:block; width:74px; height:74px; border-radius:4px; }
      #capture-controls {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 999999;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #snap-btn {
        width:68px; height:68px; border-radius:50%;
        background:#FF4500; border:4px solid #fff;
        box-shadow:0 2px 16px rgba(255,69,0,0.5);
        cursor:pointer; pointer-events:auto;
        display:flex; align-items:center; justify-content:center;
        transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
        user-select: none; -webkit-user-select: none;
        touch-action: none; -webkit-touch-callout: none;
      }
      #snap-btn:active { transform:scale(0.9); box-shadow:0 1px 8px rgba(255,69,0,0.4); }
      #snap-btn svg { width:28px; height:28px; fill:#fff; pointer-events:none; }
      #snap-btn.recording {
        background: #c62828;
      }
      #preview-modal {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.78);
        z-index: 1000000;
        display: none;
        align-items: center;
        justify-content: center;
      }
      #preview-card {
        position: relative;
        width: min(72vw, 300px);
        background: #181818;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 16px;
        padding: 8px;
      }
      #preview-media {
        width: 100%;
        max-height: 44vh;
        object-fit: contain;
        border-radius: 12px;
        background: #000;
      }
      #preview-video {
        width: 100%;
        max-height: 44vh;
        object-fit: contain;
        border-radius: 12px;
        background: #000;
        display: none;
      }
      #preview-actions {
        display: flex;
        justify-content: center;
        margin-top: 8px;
      }
      #preview-share {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 16px;
        border-radius: 16px;
        border: none;
        background: #FF4500;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      #preview-share:active { transform: scale(0.95); }
      #preview-share svg { width: 16px; height: 16px; fill: #fff; flex-shrink: 0; }
      #preview-close {
        position: absolute;
        top: -14px;
        right: -14px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #222;
        border: 2px solid rgba(255,255,255,0.3);
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 1;
        padding: 0;
        line-height: 1;
        transition: background 0.15s;
      }
      #preview-close:hover { background: #444; }
      #cta-overlay {
        position: fixed;
        left: 50%;
        top: 38%;
        transform: translate(-50%, -50%);
        z-index: 999998;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
        width: min(72vw, 320px);
      }
      #cta-overlay.visible {
        opacity: 1;
      }
      #cta-overlay.fade-out {
        opacity: 0;
      }
      #cta-overlay svg {
        width: 100%;
        height: auto;
        filter: drop-shadow(0 2px 12px rgba(0,0,0,0.5));
      }
    </style>
  </head>

          <button id="preview-share" type="button"><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>Share</button>

    <script>
      const qrExportImg = new Image();
      qrExportImg.crossOrigin = 'anonymous';
      qrExportImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https%3A%2F%2Fsuperside-immersive.github.io%2Fslam%2Fcursor-tap-to-place%2Fdist%2Ftap-to-place.html';

      const captureState = {
        isRecording: false,
        mediaRecorder: null,
        videoMime: '',
        chunks: [],
        composedCanvas: null,
        composedCtx: null,
        previewBlob: null,
        previewUrl: null,
        previewType: 'image',
      };

      const snapBtn = document.getElementById('snap-btn');
      const previewModal = document.getElementById('preview-modal');
      const previewImg = document.getElementById('preview-media');
      const previewVideo = document.getElementById('preview-video');
      const previewShareBtn = document.getElementById('preview-share');
      const previewCloseBtn = document.getElementById('preview-close');

      // Draw `src` (canvas or image) + opaque QR watermark into an off-screen 2D canvas.
      const composeWithQR = (src, w, h) => {
        if (!captureState.composedCanvas) {
          captureState.composedCanvas = document.createElement('canvas');
          captureState.composedCtx = captureState.composedCanvas.getContext('2d', { alpha: false });
        }
        const canvas = captureState.composedCanvas;
        const ctx = captureState.composedCtx;
        canvas.width = w;
        canvas.height = h;
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(src, 0, 0, w, h);
        const qrSize = Math.max(88, Math.floor(w * 0.16));
        const margin = Math.max(14, Math.floor(w * 0.02));
        const x = margin;
        const y = h - qrSize - margin;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x - 6, y - 6, qrSize + 12, qrSize + 12);
        if (qrExportImg.complete) ctx.drawImage(qrExportImg, x, y, qrSize, qrSize);
        return canvas;
      };

      const openPreview = (blob, type) => {
        if (captureState.previewUrl) URL.revokeObjectURL(captureState.previewUrl);
        captureState.previewBlob = blob;
        captureState.previewType = type;
        captureState.previewUrl = URL.createObjectURL(blob);
        if (type === 'image') {
          previewVideo.style.display = 'none';
          previewImg.style.display = 'block';
          previewImg.src = captureState.previewUrl;
        } else {
          previewImg.style.display = 'none';
          previewVideo.style.display = 'block';
          previewVideo.src = captureState.previewUrl;
          previewVideo.load();
          previewVideo.play().catch(() => {});
        }
        previewModal.style.display = 'flex';
      };

      const downloadBlob = (blob, ext) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `snoo-ar-${Date.now()}.${ext}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      };

      const shareBlob = async (blob, type) => {
        const isMP4 = type !== 'image' && (captureState.videoMime || '').includes('mp4');
        const ext = type === 'image' ? 'png' : isMP4 ? 'mp4' : 'webm';
        const mime = type === 'image' ? 'image/png' : isMP4 ? 'video/mp4' : 'video/webm';
        const file = new File([blob], `snoo-ar-${Date.now()}.${ext}`, { type: mime });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Snoo AR' });
          return;
        }
        downloadBlob(blob, ext);
      };

      const closePreview = () => {
        previewModal.style.display = 'none';
        previewVideo.pause();
      };

      previewCloseBtn.addEventListener('click', closePreview);
      previewShareBtn.addEventListener('click', async () => {
        if (!captureState.previewBlob) return;
        try {
          await shareBlob(captureState.previewBlob, captureState.previewType);
        } catch (_err) {}
      });

      // Photo — XR8.CanvasScreenshot reads pixels inside the XR render loop,
      // guaranteeing a non-black frame. Falls back to rAF for desktop/non-XR.
      const capturePhoto = () => {
        const scene = document.querySelector('a-scene');
        if (!scene || !scene.canvas) return;

        const blobFromImage = (img) => {
          const c = composeWithQR(img, img.naturalWidth || img.width, img.naturalHeight || img.height);
          c.toBlob((blob) => { if (blob) openPreview(blob, 'image'); }, 'image/png');
        };

        if (typeof XR8 !== 'undefined' && XR8.CanvasScreenshot) {
          XR8.CanvasScreenshot.takeScreenshot()
            .then((b64) => {
              const img = new Image();
              img.onload = () => blobFromImage(img);
              img.src = b64.startsWith('data:') ? b64 : 'data:image/jpeg;base64,' + b64;
            })
            .catch(() => {
              requestAnimationFrame(() => {
                const c = scene.canvas;
                composeWithQR(c, c.width, c.height).toBlob(
                  (blob) => { if (blob) openPreview(blob, 'image'); }, 'image/png'
                );
              });
            });
        } else {
          requestAnimationFrame(() => {
            const c = scene.canvas;
            composeWithQR(c, c.width, c.height).toBlob(
              (blob) => { if (blob) openPreview(blob, 'image'); }, 'image/png'
            );
          });
        }
      };

      const stopVideoRecording = () => {
        if (!captureState.isRecording) return;
        captureState.isRecording = false;
        snapBtn.classList.remove('recording');
        if (captureState.mediaRecorder && captureState.mediaRecorder.state !== 'inactive') {
          captureState.mediaRecorder.stop();
        }
      };

      // Video — captureStream() directly on the WebGL canvas.
      // The browser fires a video frame on every gl.commit() (each render cycle),
      // so no pixel readback or intermediate 2D copy needed.
      const startVideoRecording = () => {
        const scene = document.querySelector('a-scene');
        if (!scene || !scene.canvas) return;
        const stream = scene.canvas.captureStream(30);
        captureState.chunks = [];
        const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
          ? 'video/webm;codecs=vp8,opus'
          : MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')
          ? 'video/mp4;codecs=avc1'
          : '';
        captureState.videoMime = mimeType || 'video/webm';
        captureState.mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
        captureState.mediaRecorder.ondataavailable = (evt) => {
          if (evt.data && evt.data.size > 0) captureState.chunks.push(evt.data);
        };
        captureState.mediaRecorder.onstop = () => {
          const blob = new Blob(captureState.chunks, { type: captureState.videoMime || 'video/webm' });
          openPreview(blob, 'video');
          stream.getTracks().forEach((t) => t.stop());
        };
        captureState.isRecording = true;
        snapBtn.classList.add('recording');
        captureState.mediaRecorder.start(100);
      };

      // Tap = photo, hold (400ms+) = video
      let _holdTimer = null;
      const HOLD_MS = 400;

      snapBtn.addEventListener('selectstart', (e) => e.preventDefault());
      snapBtn.addEventListener('contextmenu', (e) => e.preventDefault());
      snapBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        e.preventDefault();
        _holdTimer = setTimeout(() => {
          _holdTimer = null;
          startVideoRecording();
        }, HOLD_MS);
      });

      snapBtn.addEventListener('pointerup', (e) => {
        e.stopPropagation();
        if (_holdTimer !== null) {
          clearTimeout(_holdTimer);
          _holdTimer = null;
          // Short tap — take photo
          capturePhoto();
        } else if (captureState.isRecording) {
          stopVideoRecording();
        }
      });

      snapBtn.addEventListener('pointercancel', (e) => {
        e.stopPropagation();
        if (_holdTimer !== null) { clearTimeout(_holdTimer); _holdTimer = null; }
        if (captureState.isRecording) stopVideoRecording();
      });

      // Prevent any click on the snap button from bubbling to the scene
      snapBtn.addEventListener('click', (e) => e.stopPropagation());

      // CTA overlay — show once on first placement, fade out after 3s
      const ctaOverlay = document.getElementById('cta-overlay');
      window._showCTA = () => {
        ctaOverlay.classList.add('visible');
        setTimeout(() => {
          ctaOverlay.classList.remove('visible');
          ctaOverlay.classList.add('fade-out');
        }, 3000);
      };

      const banner = document.getElementById('info-banner');
      const setBanner = (html, autoHideMs = 0) => {
        banner.innerHTML = html; banner.style.display = 'block';
        if (autoHideMs > 0) setTimeout(() => (banner.style.display = 'none'), autoHideMs);
      };
      let vrmReady = false, animReady = false;
      const updateLoadingBanner = () => {
        if (!vrmReady || !animReady)
          setBanner('<span class="ok">Loading model and animation...</span>');
        else
          setBanner('<span class="ok">Ready — Tap to place the model</span>', 3000);
      };
      window._setVrmReady = () => { vrmReady = true; updateLoadingBanner(); };
      window._setAnimReady = () => { animReady = true; updateLoadingBanner(); };
      updateLoadingBanner();

      window.addEventListener('xrloaded', () => {
        // Register 8th Wall's screenshot pipeline so takeScreenshot() works
        if (typeof XR8 !== 'undefined' && XR8.CanvasScreenshot) {
          try { XR8.addCameraPipelineModule(XR8.CanvasScreenshot.pipelineModule()); } catch(e) {}
        }
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobile) {
          banner.innerHTML = '<span class="ok">MOBILE — SLAM active</span>';
          setTimeout(() => banner.style.display = 'none', 3000);
        } else {
          banner.innerHTML =
            '<span class="ok">XR8 Engine loaded</span><br>' +
            '<span class="warning">DESKTOP: simulated preview</span><br>' +
            '<span class="tip">For real SLAM: open this URL on your phone (HTTPS)</span>';
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        const scene = document.querySelector('a-scene');
        if (!scene) return;
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const disableXrWeb = () => {
          if (scene.hasAttribute('xrweb')) scene.removeAttribute('xrweb');
        };
        if (!isMobile) {
          const waitForAssets = () => {
            if (vrmReady && animReady) disableXrWeb();
            else setTimeout(waitForAssets, 300);
          };
          waitForAssets();
        }
        scene.addEventListener('camerastatuschange', (e) => {
          if (e.detail.status === 'hasVideo')
            setBanner('<span class="ok">WEBCAM + SLAM</span>', 3000);
          if (e.detail.status === 'failed') disableXrWeb();
        });
      });
    </script>

      const getThreeLoader = (name) =>
        THREE?.[name] || window.AFRAME?.THREE?.[name] || window[name];

      /* vrm-character — EXACT COPY from slam.html (working version) */
      AFRAME.registerComponent('vrm-character', {
        schema: {
          model: { type: 'string' },
          animation: { type: 'string' },
          speed: { type: 'number', default: 0.8 }
        },
        init() {
          this.vrm = null;
          this.mixer = null;
          this.shadowReceiver = null;
          this._loadVRM();
        },
        tick(time, delta) {
          const dt = delta / 1000;
          if (this.mixer) this.mixer.update(dt);
          if (this.vrm) this.vrm.update(dt);
        },
        _loadVRM() {
          if (!this.data.model) return;
          const GLTFLoaderCtor = getThreeLoader('GLTFLoader');
          if (!GLTFLoaderCtor) { console.error('GLTFLoader no disponible'); return; }
          const loader = new GLTFLoaderCtor();
          loader.register((parser) => new THREE.VRMLoaderPlugin(parser));
          loader.load(
            encodeURI(this.data.model),
            (gltf) => {
              const vrm = gltf.userData.vrm;
              if (!vrm) { console.error('VRM not found'); return; }
              if (THREE.VRMUtils?.removeUnnecessaryJoints) THREE.VRMUtils.removeUnnecessaryJoints(vrm.scene);
              if (THREE.VRMUtils?.rotateVRM0) THREE.VRMUtils.rotateVRM0(vrm);
              this.vrm = vrm;
              this._prepareMaterials(vrm);
              // Force VRM scene to local origin so it matches placement point
              vrm.scene.position.set(0, 0, 0);
              vrm.scene.updateMatrixWorld(true);
              // Center horizontally: compute bounding box and offset X/Z
              const box = new THREE.Box3().setFromObject(vrm.scene);
              const center = box.getCenter(new THREE.Vector3());
              vrm.scene.position.set(-center.x, -box.min.y, -center.z);
              this.el.object3D.add(vrm.scene);
              this._addShadowReceiver();
              if (window._setVrmReady) window._setVrmReady();
              this._loadAnimation();
            },
            undefined,
            (err) => console.error('VRM load error:', err)
          );
        },
        _prepareMaterials(vrm) {
          vrm.scene.traverse((obj) => {
            obj.frustumCulled = false;
            if (!obj.isMesh) return;
            obj.castShadow = true;
            obj.receiveShadow = true;
            if (obj.geometry?.attributes?.uv && !obj.geometry.attributes.uv2) {
              obj.geometry.setAttribute(
                'uv2',
                new THREE.BufferAttribute(obj.geometry.attributes.uv.array, 2)
              );
            }
            const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
            materials.forEach((mat) => {
              if (!mat) return;
              const n = (mat.name || '').toLowerCase();
              const isHoodie = n === 'test' || n.includes('golden yellow') ||
                n.includes('hoodie') || n.includes('hood') || n.includes('sweater') ||
                n.includes('shirt') || n.includes('outfit') || n.includes('clothes') ||
                mat.name === '09-Golden Yellow #FFBF0B GFAR.001' || mat.name === 'Test';
              if (isHoodie) {
                mat.map = null;
                mat.color.setHex(0xf0f0f0);
                mat.roughness = 0.92;
                mat.metalness = 0.0;
                mat.emissive = new THREE.Color(0x000000);
              }
              if ('aoMapIntensity' in mat) {
                if (!mat.aoMap && mat.map) mat.aoMap = mat.map;
                mat.aoMapIntensity = mat.aoMap ? 0.62 : 0.0;
              }
              if ('envMapIntensity' in mat) mat.envMapIntensity = 0.68;
              if ('roughness' in mat) mat.roughness = Math.max(mat.roughness ?? 0.8, 0.82);
              if ('metalness' in mat) mat.metalness = Math.min(mat.metalness ?? 0.0, 0.05);
              mat.needsUpdate = true;
            });
          });
          // VRM scene stays at local origin (0,0,0) so placement position matches
          if (vrm.expressionManager) {
            try { vrm.expressionManager.setValue('joy', 1.0); } catch(e) {}
          }
        },
        _addShadowReceiver() {
          if (this.shadowReceiver) return;
          const geometry = new THREE.PlaneGeometry(2.0, 2.0);
          const material = new THREE.ShadowMaterial({ opacity: 0.28 });
          const plane = new THREE.Mesh(geometry, material);
          plane.rotation.x = -Math.PI / 2;
          plane.position.set(0, 0.002, 0);
          plane.receiveShadow = true;
          plane.renderOrder = -1;
          this.el.object3D.add(plane);
          this.shadowReceiver = plane;
        },
        async _loadAnimation() {
          if (!this.data.animation || !this.vrm) return;
          this.vrm.humanoid?.resetNormalizedPose();
          let FBXLoaderCtor = getThreeLoader('FBXLoader');
          if (!FBXLoaderCtor && window.fbxLoaderReady) {
            try { await window.fbxLoaderReady; FBXLoaderCtor = getThreeLoader('FBXLoader'); }
            catch(e) { console.error('FBXLoader unavailable:', e); return; }
          }
          if (!FBXLoaderCtor) { console.error('FBXLoader unavailable'); return; }
          const fbxLoader = new FBXLoaderCtor();
          fbxLoader.load(
            encodeURI(this.data.animation),
            (fbx) => {
              const clip = this._convertMixamoAnimation(fbx);
              if (!clip) { console.error('Animation conversion failed'); return; }
              if (this.mixer) this.mixer.stopAllAction();
              this.mixer = new THREE.AnimationMixer(this.vrm.scene);
              const action = this.mixer.clipAction(clip);
              action.setLoop(THREE.LoopRepeat, Infinity);
              action.clampWhenFinished = false;
              action.timeScale = this.data.speed;
              action.play();
              if (window._setAnimReady) window._setAnimReady();
            },
            undefined,
            (err) => console.error('FBX load error:', err)
          );
        },
        _convertMixamoAnimation(fbx) {
          const clip = THREE.AnimationClip.findByName(fbx.animations, 'mixamo.com') || fbx.animations[0];
          if (!clip) return null;
          const tracks = [];
          const restRotationInverse = new THREE.Quaternion();
          const parentRestWorldRotation = new THREE.Quaternion();
          const quatTemp = new THREE.Quaternion();
          const vec3Temp = new THREE.Vector3();
          const hipsNode = fbx.getObjectByName('mixamorigHips') || fbx.getObjectByName('mixamorig:Hips');
          const motionHipsHeight = hipsNode ? hipsNode.position.y : null;
          const vrmHipsY = this.vrm.humanoid?.getNormalizedBoneNode('hips')?.getWorldPosition(vec3Temp).y;
          const vrmRootY = this.vrm.scene.getWorldPosition(vec3Temp).y;
          const vrmHipsHeight = Math.abs(vrmHipsY - vrmRootY);
          const hipsPositionScale = motionHipsHeight ? (vrmHipsHeight / motionHipsHeight) : 1;
          clip.tracks.forEach((track) => {
            const trackSplitted = track.name.split('.');
            const mixamoRigName = trackSplitted[0];
            const rigName = mixamoRigName.split('|').pop();
            const cleanedRigName = rigName
              .replace(/^mixamorig:/, '').replace(/^mixamorig_/, '').replace(/^mixamorig/, '');
            const normalizedRigName = rigName.replace('mixamorig:', 'mixamorig');
            const rigCandidates = [
              rigName, mixamoRigName, normalizedRigName, cleanedRigName,
              'mixamorig' + cleanedRigName, 'mixamorig:' + cleanedRigName
            ];
            const vrmBoneName = rigCandidates.map((n) => MIXAMO_RIG_MAP[n]).find(Boolean);
            const vrmNodeName = this.vrm.humanoid?.getNormalizedBoneNode(vrmBoneName)?.name;
            const mixamoRigNode = rigCandidates.map((n) => fbx.getObjectByName(n)).find(Boolean);
            if (!vrmNodeName || !mixamoRigNode) return;
            const propertyName = trackSplitted[1];
            mixamoRigNode.getWorldQuaternion(restRotationInverse).invert();
            if (mixamoRigNode.parent) {
              mixamoRigNode.parent.getWorldQuaternion(parentRestWorldRotation);
            } else {
              parentRestWorldRotation.identity();
            }
            if (track.ValueTypeName === 'quaternion') {
              for (let i = 0; i < track.values.length; i += 4) {
                const fq = track.values.slice(i, i + 4);
                quatTemp.fromArray(fq);
                quatTemp.premultiply(parentRestWorldRotation).multiply(restRotationInverse);
                quatTemp.toArray(fq);
                fq.forEach((v, idx) => { track.values[idx + i] = v; });
              }
              tracks.push(new THREE.QuaternionKeyframeTrack(
                vrmNodeName + '.' + propertyName, track.times,
                track.values.map((v, i) =>
                  this.vrm.meta?.metaVersion === '0' && i % 2 === 0 ? -v : v
                )
              ));
            } else if (track.ValueTypeName === 'vector') {
              const vals = track.values.map((v, i) => {
                const axis = i % 3;
                let value = (this.vrm.meta?.metaVersion === '0' && axis !== 1 ? -v : v) * hipsPositionScale;
                if (vrmBoneName === 'hips' && propertyName === 'position' && axis !== 1) {
                  value = 0;
                }
                return value;
              });
              tracks.push(new THREE.VectorKeyframeTrack(
                vrmNodeName + '.' + propertyName, track.times, vals
              ));
            }
          });
          return new THREE.AnimationClip('vrmAnimation', clip.duration, tracks);
        }
      });

      /* ground-reticle — cyan ring that follows screen-center raycast to y=0 */
      AFRAME.registerComponent('ground-reticle', {
        init() {
          this.raycaster = new THREE.Raycaster();
          this.groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
          this.hitVec = new THREE.Vector3();
          this.lerpTarget = new THREE.Vector3();
          this.visible = true;
        },
        tick() {
          const cam = this.el.sceneEl.camera;
          if (!cam) return;
          // Raycast from screen center
          this.raycaster.setFromCamera({ x: 0, y: 0 }, cam);
          if (this.raycaster.ray.intersectPlane(this.groundPlane, this.hitVec)) {
            this.lerpTarget.copy(this.hitVec);
            this.lerpTarget.y = 0.01; // tiny offset to avoid z-fighting
            this.el.object3D.position.lerp(this.lerpTarget, 0.4);
            if (!this.el.object3D.visible) this.el.object3D.visible = true;
          }
        },
        hide() { this.el.object3D.visible = false; this.visible = false; },
        show() { this.el.object3D.visible = true; this.visible = true; }
      });

      /* tap-to-place — raycast screen tap to y=0 ground, place VRM there */
      AFRAME.registerComponent('tap-to-place', {
        init() {
          this.placed = false;
          this.raycaster = new THREE.Raycaster();
          this.el.object3D.visible = false;
          this.onTap = this.onTap.bind(this);
          this.onClick = this.onClick.bind(this);
          const attach = () => {
            if (this.el.sceneEl.canvas)
              this.el.sceneEl.canvas.addEventListener('touchstart', this.onTap);
            window.addEventListener('click', this.onClick);
          };
          if (this.el.sceneEl.hasLoaded) attach();
          else this.el.sceneEl.addEventListener('loaded', attach);
        },
        remove() {
          if (this.el.sceneEl.canvas)
            this.el.sceneEl.canvas.removeEventListener('touchstart', this.onTap);
          window.removeEventListener('click', this.onClick);
        },
        _isOnUI(x, y) {
          const el = document.elementFromPoint(x, y);
          return !!(el && el.closest('#capture-controls, #preview-modal, #gh-qr, #info-banner'));
        },
        onTap(evt) {
          if (!evt.touches || evt.touches.length < 1) return;
          // Ignore multi-touch (pinch/rotate gestures)
          if (evt.touches.length >= 2) return;
          const t = evt.touches[0];
          if (this._isOnUI(t.clientX, t.clientY)) return;
          this._place(t.clientX, t.clientY);
        },
        onClick(evt) {
          if (evt.target && evt.target.closest('#capture-controls, #preview-modal, #gh-qr, #info-banner')) return;
          this._place(evt.clientX, evt.clientY);
        },
        _place(sx, sy) {
          const scene = this.el.sceneEl;
          const cam = scene.camera;
          if (!cam) return;
          const hit = new THREE.Vector3();
          const reticle = document.getElementById('ground-ring');
          let hasHit = false;
          if (reticle && reticle.object3D && reticle.getAttribute('visible') !== false) {
            reticle.object3D.getWorldPosition(hit);
            hit.y = 0;
            hasHit = true;
          } else {
            const rect = scene.canvas.getBoundingClientRect();
            const nx = ((sx - rect.left) / rect.width) * 2 - 1;
            const ny = -((sy - rect.top) / rect.height) * 2 + 1;
            this.raycaster.setFromCamera({ x: nx, y: ny }, cam);
            const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            hasHit = this.raycaster.ray.intersectPlane(ground, hit);
          }
          if (hasHit) {
            const isFirst = !this.placed;
            this.el.object3D.position.copy(hit);
            this.el.object3D.visible = true;
            this.placed = true;
            // Face camera but only rotate Y so the VRM stays grounded
            const cp = new THREE.Vector3();
            cam.getWorldPosition(cp);
            const angle = Math.atan2(cp.x - hit.x, cp.z - hit.z);
            this.el.object3D.rotation.set(0, angle, 0);
            const halo = this.el.components['teleport-halo'];
            if (halo && typeof halo.play === 'function') halo.play();
            if (isFirst && window._showCTA) window._showCTA();
          }
        }
      });

      /* teleport-halo — reddit orange particle rings on each placement */
      AFRAME.registerComponent('teleport-halo', {
        init() {
          this.effects = [];
        },
        _disposeEffect(effect) {
          if (!effect) return;
          effect.rings.forEach((ring) => {
            ring.points.geometry.dispose();
            ring.points.material.dispose();
          });
          this.el.object3D.remove(effect.group);
        },
        play() {
          this.effects.forEach((effect) => this._disposeEffect(effect));
          this.effects = [];

          const burst = {
            group: new THREE.Group(),
            rings: [],
            age: 0,
            duration: 1.55,
          };

          const ringCount = 7;
          for (let ringIndex = 0; ringIndex < ringCount; ringIndex++) {
            const y = 0.08 + ringIndex * 0.16;
            const radius = 0.72 + Math.random() * 0.24;
            const pointsCount = 14 + Math.floor(Math.random() * 9);
            const positions = new Float32Array(pointsCount * 3);

            for (let i = 0; i < pointsCount; i++) {
              const angle = (i / pointsCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
              const ringJitter = (Math.random() - 0.5) * 0.09;
              const rr = radius + ringJitter;
              positions[i * 3 + 0] = Math.cos(angle) * rr;
              positions[i * 3 + 1] = y + (Math.random() - 0.5) * 0.02;
              positions[i * 3 + 2] = Math.sin(angle) * rr;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
              color: 0xFF4500,
              size: 0.035 + Math.random() * 0.012,
              transparent: true,
              opacity: 0.95,
              depthWrite: false,
              blending: THREE.AdditiveBlending,
            });

            const points = new THREE.Points(geometry, material);
            burst.group.add(points);
            burst.rings.push({
              points,
              speedY: 0.22 + Math.random() * 0.24,
              spread: 1.0 + Math.random() * 0.35,
            });
          }

          this.el.object3D.add(burst.group);
          this.effects.push(burst);
        },
        tick(_time, delta) {
          const dt = delta / 1000;
          if (!this.effects.length) return;

          this.effects = this.effects.filter((effect) => {
            effect.age += dt;
            const t = effect.age / effect.duration;
            const alive = t < 1;

            effect.rings.forEach((ring) => {
              ring.points.position.y += ring.speedY * dt;
              const radialScale = 1 + t * 0.14 * ring.spread;
              ring.points.scale.set(radialScale, 1, radialScale);
              ring.points.material.opacity = Math.max(0, 0.95 * (1 - t));
            });

            if (!alive) this._disposeEffect(effect);
            return alive;
          });
        },
      });

      /* pinch-scale — two-finger pinch to scale + rotate the placed VRM */
      AFRAME.registerComponent('pinch-scale', {
        schema: {
          minScale: { type: 'number', default: 0.2 },
          maxScale: { type: 'number', default: 5.0 },
          rotationFactor: { type: 'number', default: 3.0 }
        },
        init() {
          this.initialSpread = 0;
          this.initialScale = 1;
          this.currentRotationY = 0;
          this.onTouchStart = this.onTouchStart.bind(this);
          this.onTouchMove = this.onTouchMove.bind(this);
          this.onTouchEnd = this.onTouchEnd.bind(this);
          const attach = () => {
            const canvas = this.el.sceneEl.canvas;
            if (canvas) {
              canvas.addEventListener('touchstart', this.onTouchStart, { passive: false });
              canvas.addEventListener('touchmove', this.onTouchMove, { passive: false });
              canvas.addEventListener('touchend', this.onTouchEnd);
            }
          };
          if (this.el.sceneEl.hasLoaded) attach();
          else this.el.sceneEl.addEventListener('loaded', attach);
        },
        remove() {
          const canvas = this.el.sceneEl.canvas;
          if (canvas) {
            canvas.removeEventListener('touchstart', this.onTouchStart);
            canvas.removeEventListener('touchmove', this.onTouchMove);
            canvas.removeEventListener('touchend', this.onTouchEnd);
          }
        },
        _getSpread(touches) {
          if (touches.length < 2) return 0;
          const dx = touches[1].clientX - touches[0].clientX;
          const dy = touches[1].clientY - touches[0].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        },
        _getMidAngle(touches) {
          if (touches.length < 2) return 0;
          return Math.atan2(
            touches[1].clientY - touches[0].clientY,
            touches[1].clientX - touches[0].clientX
          );
        },
        onTouchStart(evt) {
          if (evt.touches.length === 2) {
            // Only allow pinch after model has been placed
            const ttp = this.el.components['tap-to-place'];
            if (!ttp || !ttp.placed) return;
            evt.preventDefault();
            this.initialSpread = this._getSpread(evt.touches);
            this.initialScale = this.el.object3D.scale.x;
            this.initialAngle = this._getMidAngle(evt.touches);
            this.initialRotY = this.currentRotationY;
          }
        },
        onTouchMove(evt) {
          if (evt.touches.length !== 2 || this.initialSpread <= 0) return;
          evt.preventDefault();
          // Pinch-to-scale
          const spread = this._getSpread(evt.touches);
          const ratio = spread / this.initialSpread;
          let newScale = this.initialScale * ratio;
          newScale = Math.max(this.data.minScale, Math.min(this.data.maxScale, newScale));
          this.el.object3D.scale.set(newScale, newScale, newScale);
          // Two-finger rotation
          const angle = this._getMidAngle(evt.touches);
          const angleDelta = angle - this.initialAngle;
          this.currentRotationY = this.initialRotY - angleDelta * this.data.rotationFactor;
          this.el.object3D.rotation.y = this.currentRotationY;
        },
        onTouchEnd(evt) {
          if (evt.touches.length < 2) {
            this.initialSpread = 0;
          }
        }
      });
    </script>

    <a-scene
      xrweb="disableWorldTracking: false; allowedDevices: any"
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true; shadowMapEnabled: true; shadowMapType: pcfsoft; preserveDrawingBuffer: true"
      loading-screen="enabled: false">

      <a-entity light="type: ambient; intensity: 0.55"></a-entity>
      <a-entity
        light="type: directional; intensity: 0.9; castShadow: true; shadowBias: -0.0002; shadowMapWidth: 1024; shadowMapHeight: 1024; shadowCameraTop: 3; shadowCameraRight: 3; shadowCameraBottom: -3; shadowCameraLeft: -3; shadowCameraFar: 10"
        position="-1 2 1">
      </a-entity>

      <!-- Ground placement reticle (RDDT image) -->
      <a-image
        id="ground-ring"
        ground-reticle
        src="./assets/RDDT.png"
        rotation="-90 0 0"
        width="0.6"
        height="0.6"
        material="shader: flat; transparent: true; opacity: 0.85">
      </a-image>

      <!-- VRM with tap-to-place + pinch-to-scale (hidden until first tap) -->
      <a-entity
        id="snoo-vrm"
        scale="0.9 0.9 0.9"
        tap-to-place
        teleport-halo
        pinch-scale="minScale: 0.5; maxScale: 2.5; rotationFactor: 3.0"
        vrm-character="model: ./redditslides/public/finalsnoo.vrm; animation: ./redditslides/public/reddit-animation/animations/Step Hip Hop Dance.fbx; speed: 0.8">
      </a-entity>

      <a-camera position="0 1.2 0"></a-camera>
    </a-scene>
  </body>
</html>
